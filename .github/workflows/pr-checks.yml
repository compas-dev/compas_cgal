name: pull-request-policy

on:
  pull_request:
    branches: [main, initiative/repository-modernisation]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
      - uses: compas-dev/compas-actions/pr-checks@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate

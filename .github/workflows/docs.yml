name: docs

on:
  pull_request:
    branches: [main, initiative/repository-modernisation]
    paths: ["docs/**", "mkdocs.yml", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          dependency-groups: docs
          extras: ""
          strict: true

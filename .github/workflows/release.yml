name: release

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate

  wheels:
    needs: detect
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux
            arch: x86_64
          - os: macos-15-intel
            platform: macos-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: AMD64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@c923d83ad9c1bc00211c5041d0c3f73294ff88f6 # v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_TEST: >-
            python -m pip install
            "compas @ git+https://github.com/compas-dev/compas.git@3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e"
          CIBW_TEST_REQUIRES: numpy>=1.26 pytest build
        with:
          output-dir: wheelhouse
      - name: Verify wheel contents
        shell: bash
        run: python .github/scripts/verify_native_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    needs: detect
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: compas-dev/compas-actions/package@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints/compas-candidate.txt
        with:
          sdist: true
          wheel: false
          skip-install: true
      - name: Build a wheel from the source distribution
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir sdist-wheelhouse
      - name: Verify the source-built wheel
        run: python .github/scripts/verify_native_wheel.py sdist-wheelhouse/*.whl
      - uses: compas-dev/compas-actions/package@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints/compas-candidate.txt
        with:
          build: false
          output-directory: sdist-wheelhouse
          import-modules: >-
            compas_cgal,
            compas_cgal._booleans,
            compas_cgal._geodesics,
            compas_cgal._intersections,
            compas_cgal._isolines,
            compas_cgal._measure,
            compas_cgal._meshing,
            compas_cgal._polylines,
            compas_cgal._reconstruction,
            compas_cgal._skeletonization,
            compas_cgal._slicer,
            compas_cgal._straight_skeleton_2,
            compas_cgal._subdivision,
            compas_cgal._triangulation,
            compas_cgal._types_std
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  prepare:
    needs: [detect, wheels, sdist]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete distribution set
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          test -z "$(find dist -maxdepth 1 -type f -size 0c -print -quit)"
      - uses: compas-dev/compas-actions/package@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          build: false
          output-directory: dist
          skip-install: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [detect, prepare]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/compas-cgal
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    needs: [detect, publish]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.detect.outputs.tag }}
          target: ${{ github.sha }}
          release-name-prefix: COMPAS CGAL
          distribution-artifact-name: python-package-distributions

[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_cgal"
description = "CGAL wrapper for COMPAS."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "compas>=3.0,<4",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "build>=1.2",
    "bump-my-version>=1.2",
    "cibuildwheel>=2.23",
    "cmake>=3.15",
    "compas-invocations2>=0.1",
    "invoke>=2.2",
    "nanobind>=2.12",
    "ninja>=1.11",
    "pyright==1.1.414",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.14",
    "scikit-build-core>=0.10",
    "twine>=6",
]
docs = [
    { include-group = "dev" },
    "markdown-callouts>=0.4",
    "markdown-exec>=1.8",
    "mike>=2",
    "mkdocs>=1.6",
    "mkdocs-autorefs>=1.4",
    "mkdocs-coverage>=1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-llmstxt>=0.2",
    "mkdocs-material>=9.5",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-redirects>=1.2",
    "mkdocs-section-index>=0.3",
    "mkdocstrings[python]>=0.30",
    "pydantic>=2.10",
]
viz = ["compas-viewer>=2"]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_cgal"

[project.entry-points."compas.plugins"]
compas_cgal_booleans = "compas_cgal.plugins.booleans"
compas_cgal_intersections = "compas_cgal.plugins.intersections"
compas_cgal_mesh = "compas_cgal.plugins.mesh"
compas_cgal_trimesh = "compas_cgal.plugins.trimesh"
compas_cgal_triangulation = "compas_cgal.plugins.triangulation"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "e54f8ae0eba39e84b1290bea9c368a1a646dfdcd" }

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# scikit-build
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"                    # Python 3.12 stable ABI baseline.
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_cgal/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# ============================================================================
# cibuildwheel
# ============================================================================

[tool.cibuildwheel]
build = ["cp312-*"] # One CPython 3.12 stable-ABI wheel supports Python 3.12+.
build-verbosity = 3
test-requires = ["numpy>=1.24", "compas>=3.0,<4", "pytest", "build"]
test-command = "pip list && pytest {project}/tests"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux_2_28"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "0.9.5"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_cgal/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/compas_cgal"]
exclude = ["build", "dist", "external"]
pythonVersion = "3.12"
reportMissingModuleSource = false
